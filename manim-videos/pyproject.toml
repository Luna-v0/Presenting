readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "manim>=0.19.0",
    "manim-slides[pyside6]>=5.1.3",
    "manim-beamer",
]

[tool.uv.sources]
manim-beamer = { git = "https://github.com/johnHostetter/manim-beamer", rev = "main" }

[tool.uv]
package = false
